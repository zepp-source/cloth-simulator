<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional cloth physics simulation" />
  <title>Cloth Studio</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="panel" id="panel">
    <div class="panel-header">
      <h1>Cloth Studio</h1>
      <button class="toggle-btn" id="toggle-btn">−</button>
    </div>

    <div class="panel-body" id="panel-body">
      <!-- Presets -->
      <div class="section">
        <label class="section-title">Material</label>
        <div class="buttons">
          <button class="btn active" data-preset="silk">Silk</button>
          <button class="btn" data-preset="linen">Linen</button>
          <button class="btn" data-preset="denim">Denim</button>
          <button class="btn" data-preset="wool">Wool</button>
        </div>
      </div>

      <!-- Interaction -->
      <div class="section">
        <label class="section-title">Mode</label>
        <div class="buttons">
          <button class="btn active" data-mode="grab">Grab</button>
          <button class="btn" data-mode="tear">Tear</button>
          <button class="btn" data-mode="pin">Pin</button>
        </div>
      </div>

      <!-- Physics -->
      <div class="section">
        <label class="section-title">Physics</label>
        <div class="sliders">
          <div class="slider">
            <label>Stiffness</label>
            <input type="range" id="stiffness" min="0.1" max="1" step="0.05" value="0.75" />
            <span class="value" id="val-stiffness">0.75</span>
          </div>
          <div class="slider">
            <label>Damping</label>
            <input type="range" id="damping" min="0.95" max="1" step="0.001" value="0.9945" />
            <span class="value" id="val-damping">0.9945</span>
          </div>
          <div class="slider">
            <label>Gravity</label>
            <input type="range" id="gravity" min="0" max="1.5" step="0.05" value="0.35" />
            <span class="value" id="val-gravity">0.35</span>
          </div>
          <div class="slider">
            <label>Tear Threshold</label>
            <input type="range" id="tear" min="5" max="120" step="5" value="35" />
            <span class="value" id="val-tear">35</span>
          </div>
          <div class="slider">
            <label>Wind</label>
            <input type="range" id="wind" min="0" max="3" step="0.1" value="0" />
            <span class="value" id="val-wind">0.0</span>
          </div>
          <div class="slider">
            <label>Iterations</label>
            <input type="range" id="iterations" min="2" max="12" step="1" value="6" />
            <span class="value" id="val-iterations">6</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="section">
        <div class="buttons">
          <button class="btn-action" id="reset">Reset</button>
          <button class="btn-action" id="pause">Pause</button>
        </div>
      </div>

      <!-- Info -->
      <div class="info">
        <p>Drag to grab • Right-click to tear • R to reset</p>
        <p id="fps">FPS: 60</p>
      </div>
    </div>
  </div>

  <script src="./js/physics.js"></script>
  <script src="./js/presets.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
